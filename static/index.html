<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Appointment Scheduler Assistant</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root { color-scheme: light dark; }
    body { font-family: system-ui, sans-serif; max-width: 760px; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; }
    h1 { font-size: 1.4rem; }
    fieldset { border: 1px solid #8884; border-radius: 8px; margin-bottom: 1rem; }
    textarea { width: 100%; box-sizing: border-box; font: inherit; }
    button { padding: 0.5rem 1rem; cursor: pointer; }
    pre { background: #8881; padding: 0.75rem; border-radius: 6px; overflow-x: auto; white-space: pre-wrap; word-break: break-word; }
    table { width: 100%; border-collapse: collapse; margin-top: 0.5rem; }
    th, td { text-align: left; padding: 0.4rem; border-bottom: 1px solid #8884; }
    .stage { margin-bottom: 0.75rem; }
    .stage h3 { margin-bottom: 0.25rem; font-size: 0.95rem; }
    .status-ok { color: #1a7f37; font-weight: 600; }
    .status-needs_clarification { color: #b35900; font-weight: 600; }
    .status-slot_conflict { color: #b3261e; font-weight: 600; }
  </style>
</head>
<body>
  <h1>AI-Powered Appointment Scheduler Assistant</h1>
  <p>Submit a natural-language appointment request as text, or upload a photo of a handwritten/typed note.</p>

  <fieldset>
    <legend>New request</legend>
    <form id="scheduleForm">
      <label for="text">Text</label>
      <textarea id="text" name="text" rows="2" placeholder="Book dentist next Friday at 3pm"></textarea>
      <p>— or —</p>
      <label for="image">Image</label>
      <input id="image" name="image" type="file" accept="image/*" />
      <p><button type="submit">Submit</button></p>
    </form>
  </fieldset>

  <div id="output"></div>

  <fieldset>
    <legend>Booked appointments</legend>
    <table id="appointmentsTable">
      <thead><tr><th>Department</th><th>Date</th><th>Time</th><th>TZ</th><th>Status</th></tr></thead>
      <tbody></tbody>
    </table>
  </fieldset>

  <script>
    const form = document.getElementById('scheduleForm');
    const output = document.getElementById('output');
    const tbody = document.querySelector('#appointmentsTable tbody');

    async function refreshAppointments() {
      const res = await fetch('/api/v1/appointments');
      const rows = await res.json();
      tbody.innerHTML = '';
      for (const row of rows) {
        const tr = document.createElement('tr');
        tr.innerHTML = `<td>${row.department}</td><td>${row.date}</td><td>${row.time}</td><td>${row.tz}</td><td>${row.status}</td>`;
        tbody.appendChild(tr);
      }
    }

    function renderStage(title, obj) {
      if (!obj) return '';
      return `<div class="stage"><h3>${title}</h3><pre>${JSON.stringify(obj, null, 2)}</pre></div>`;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const text = document.getElementById('text').value;
      const imageFile = document.getElementById('image').files[0];

      const body = new FormData();
      if (imageFile) {
        body.append('image', imageFile);
      } else if (text.trim()) {
        body.append('text', text);
      } else {
        output.innerHTML = '<p>Provide text or an image.</p>';
        return;
      }

      output.innerHTML = '<p>Processing…</p>';
      try {
        const res = await fetch('/api/v1/schedule', { method: 'POST', body });
        const data = await res.json();
        if (!res.ok) {
          output.innerHTML = `<pre>${JSON.stringify(data, null, 2)}</pre>`;
          return;
        }
        const trace = data.trace || {};
        const result = data.result || {};
        const statusClass = 'status-' + (result.status || 'ok');
        output.innerHTML =
          renderStage('Step 1 · OCR / Text Extraction', trace.ocr) +
          renderStage('Step 2 · Entity Extraction', trace.entities) +
          renderStage('Step 3 · Normalization', trace.normalized) +
          `<div class="stage"><h3>Step 4 · Final Result (<span class="${statusClass}">${result.status}</span>)</h3><pre>${JSON.stringify(result, null, 2)}</pre></div>`;
        await refreshAppointments();
      } catch (err) {
        output.innerHTML = `<p>Request failed: ${err}</p>`;
      }
    });

    refreshAppointments();
  </script>
</body>
</html>
